<!--
title: 無料相談のご予約｜株式会社DSK
description: 中小企業の社長向け無料相談（オンライン60分）の予約フォームです。退職金制度、役員退職金、法人保険の見直し、相続税対策のご相談を承ります。
-->
<main>
  <div class="article">
    <p class="crumbs"><a href="{{root}}index.html">トップ</a> ／ 無料相談のご予約</p>
    <h1>無料相談のご予約</h1>
    <p>初回はオンライン（Zoomなど）で60分、無料です。ご入力いただいた内容を確認し、2営業日以内にメールで日程をご連絡します。2回目以降のご相談は1時間22,000円（税込）です。</p>
    {{form_notice}}
    <form class="form" action="{{form_action}}" method="POST">
      {{form_hidden:[DSK site] New consultation booking|thanks.html}}
      <input type="hidden" name="topics" id="topics">

      <fieldset>
        <legend>ご連絡先</legend>
        <div class="field">
          <label for="company">会社名 <span class="req">必須</span></label>
          <input id="company" name="company" type="text" required autocomplete="organization">
        </div>
        <div class="field">
          <label for="name">お名前 <span class="req">必須</span></label>
          <input id="name" name="name" type="text" required autocomplete="name">
        </div>
        <div class="field">
          <label for="email">メールアドレス <span class="req">必須</span></label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="tel">電話番号</label>
          <input id="tel" name="phone" type="tel" autocomplete="tel">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="pref">所在地（都道府県）</label>
            <input id="pref" name="prefecture" type="text" placeholder="例：大阪府">
          </div>
          <div class="field">
            <label for="staff">従業員数</label>
            <select id="staff" name="employees">
              <option value="">選択してください</option>
              <option>1〜9名</option><option>10〜29名</option><option>30〜99名</option><option>100名以上</option>
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>ご相談したいこと（いくつでも）</legend>
        <div class="checks">
          <label><input type="checkbox" data-topic value="従業員の退職金制度"> 従業員の退職金制度</label>
          <label><input type="checkbox" data-topic value="社長の退職金（法人NISA）"> 社長の退職金（法人NISA）</label>
          <label><input type="checkbox" data-topic value="法人保険の見直し"> 法人保険の見直し</label>
          <label><input type="checkbox" data-topic value="相続税・自社株対策"> 相続税・自社株対策</label>
          <label><input type="checkbox" data-topic value="事業保障"> 事業保障</label>
          <label><input type="checkbox" data-topic value="その他"> その他</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>ご希望の日時</legend>
        <p class="note">平日・土日を問わず、ご都合のよい候補を2つほどお書きください。</p>
        <div class="field">
          <label for="d1">第1希望</label>
          <input id="d1" name="date_1" type="text" placeholder="例：10月8日（水）14時〜">
        </div>
        <div class="field">
          <label for="d2">第2希望</label>
          <input id="d2" name="date_2" type="text" placeholder="例：10月10日（金）午前">
        </div>
      </fieldset>

      <div class="field">
        <label for="msg">ご相談の内容・気になっていること</label>
        <textarea id="msg" name="message" rows="6" placeholder="例：社員が15名になり、退職金制度を作るか迷っています。"></textarea>
      </div>

      <label class="agree"><input id="agree" type="checkbox" required> <span>株式会社DSKの<a href="https://www.dsk-real.co.jp/blank-8" rel="noopener">個人情報保護方針</a>に同意します <span class="req">必須</span></span></label>

      <div class="btn-row"><button class="btn" type="submit">この内容で予約を申し込む</button></div>
      <p class="note">送信後、迷惑メール防止の確認画面が表示されることがあります。</p>
    </form>
    <script>
    document.querySelector("form.form").addEventListener("submit", function () {
      document.getElementById("topics").value = Array.prototype.map.call(document.querySelectorAll("[data-topic]:checked"), function (c) { return c.value; }).join(" / ");
    });
    </script>
  </div>
</main>
